<div class="invitation-container">

  <div class="overlay"></div>

  <!-- Floating Hearts -->
  <div class="hearts">
    <span *ngFor="let item of hearts">❤</span>
  </div>

  <!-- Main Card -->
  <div class="invite-card">

    <div class="top-text">
      YOU ARE INVITED TO
    </div>

    <h1 class="title">
      Engagement Ceremony
    </h1>

    <!-- Couple Image -->
    <div class="couple-image">
      <img
        src="https://images.unsplash.com/photo-1520854221256-17451cc331bf?q=80&w=800&auto=format&fit=crop"
        alt="couple"
      />
    </div>

    <!-- Names -->
    <div class="names">
      <div>Tarun</div>

      <div class="and">&</div>

      <div>Diksha</div>
    </div>

    <!-- Quote -->
    <p class="quote">
      Together with our families,
      we invite you to celebrate
      the beginning of our forever ❤️
    </p>

    <!-- Details -->
    <div class="details-card">

      <div class="detail-item">
        📅 19 June 2026
      </div>

      <div class="detail-item">
        🕑 02:00 PM — 08:00 PM
      </div>

      <div class="venue">
        Shiv Shambhu Party Lawn
      </div>

      <div class="address">
        GT Road, Araul
      </div>

    </div>

    <!-- Buttons -->
    <div class="buttons">

      <a
        class="btn location-btn"
        href="https://maps.app.goo.gl/TJRGxFYJ4BD3Chgz6?g_st=aw"
        target="_blank"
      >
        📍 Open Location
      </a>

      <a
        class="btn calendar-btn"
        href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Tarun+%26+Diksha+Engagement&dates=20260619T083000Z/20260619T143000Z&location=Shiv+Shambhu+Party+Lawn,+GT+Road,+Araul"
        target="_blank"
      >
        📅 Add To Calendar
      </a>

    </div>

  </div>

</div>
