<nav
    class="fixed top-0 left-0 w-full z-50 border-b border-gray-200 dark:border-white/10 bg-white/80 dark:bg-slate-950/85 backdrop-blur-xl">

    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">

        <!-- Logo -->
        <a routerLink="/home" class="text-2xl font-extrabold tracking-tight">
            <span class="text-purple-600">T</span>
            <span class="text-slate-900 dark:text-white">arun </span>
            <span class="text-purple-600">K</span>
            <span class="text-slate-900 dark:text-white">atiyar</span>
        </a>

        <!-- Desktop Navigation -->
        <div class="hidden md:flex items-center gap-8">

            <a routerLink="/home" routerLinkActive="text-purple-600"
                class="text-sm font-medium text-slate-600 dark:text-gray-300 hover:text-purple-500 transition">
                Home
            </a>

            <a routerLink="/about" routerLinkActive="text-purple-600"
                class="text-sm font-medium text-slate-600 dark:text-gray-300 hover:text-purple-500 transition">
                About
            </a>

            <a routerLink="/skills" routerLinkActive="text-purple-600"
                class="text-sm font-medium text-slate-600 dark:text-gray-300 hover:text-purple-500 transition">
                Skills
            </a>

            <a routerLink="/projects" routerLinkActive="text-purple-600"
                class="text-sm font-medium text-slate-600 dark:text-gray-300 hover:text-purple-500 transition">
                Projects
            </a>

            <a routerLink="/experience" routerLinkActive="text-purple-600"
                class="text-sm font-medium text-slate-600 dark:text-gray-300 hover:text-purple-500 transition">
                Experience
            </a>

            <a routerLink="/contact" routerLinkActive="text-purple-600"
                class="text-sm font-medium text-slate-600 dark:text-gray-300 hover:text-purple-500 transition">
                Contact
            </a>

        </div>

        <!-- Actions -->
        <div class="flex items-center gap-3">

            <button (click)="toggleTheme()"
                class="w-10 h-10 rounded-full border border-gray-300 dark:border-white/20 text-slate-700 dark:text-white hover:bg-gray-100 dark:hover:bg-white/10 transition">
                {{ isDarkMode ? '☀️' : '🌙' }}
            </button>

            <button (click)="toggleMenu()" class="md:hidden text-2xl text-slate-900 dark:text-white">
                {{ isMenuOpen ? '✕' : '☰' }}
            </button>

        </div>

    </div>

    <!-- Mobile Navigation -->
    @if (isMenuOpen) {
    <div
        class="md:hidden bg-white dark:bg-slate-950 border-t border-gray-200 dark:border-white/10 px-6 py-5 flex flex-col gap-5">

        <a routerLink="/home" (click)="closeMenu()" class="text-slate-700 dark:text-white">Home</a>
        <a routerLink="/about" (click)="closeMenu()" class="text-slate-700 dark:text-white">About</a>
        <a routerLink="/skills" (click)="closeMenu()" class="text-slate-700 dark:text-white">Skills</a>
        <a routerLink="/projects" (click)="closeMenu()" class="text-slate-700 dark:text-white">Projects</a>
        <a routerLink="/experience" (click)="closeMenu()" class="text-slate-700 dark:text-white">Experience</a>
        <a routerLink="/contact" (click)="closeMenu()" class="text-slate-700 dark:text-white">Contact</a>

    </div>
    }
